<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verify your email · Fixibl</title>

  <meta name="robots" content="noindex">

  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --kraft: #F3EDDF;
      --paper: #FCFAF3;
      --ink: #26323C;
      --muted: #7A7567;
      --line: #E3DAC6;
      --navy: #1E3A52;
      --orange: #E07D2B;
      --green: #4E8D5B;
      --danger: #B23A26;

      --font-display:
        'Bricolage Grotesque',
        sans-serif;

      --font-ui:
        'Hanken Grotesk',
        sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      color: var(--ink);
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background-color: var(--kraft);

      background-image:
        radial-gradient(
          circle at 6% 4%,
          rgba(224, 125, 43, .20),
          transparent 30%
        ),
        radial-gradient(
          circle at 94% 3%,
          rgba(46, 110, 158, .18),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 97%,
          rgba(78, 141, 91, .20),
          transparent 34%
        ),
        radial-gradient(
          circle at 3% 94%,
          rgba(207, 148, 18, .18),
          transparent 30%
        ),
        radial-gradient(
          rgba(38, 50, 60, .06) 1.4px,
          transparent 1.4px
        );

      background-size:
        auto,
        auto,
        auto,
        auto,
        22px 22px;

      background-repeat:
        no-repeat,
        no-repeat,
        no-repeat,
        no-repeat,
        repeat;

      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--paper);

      border: 1.5px solid var(--line);
      border-radius: 22px;

      padding: 36px 30px;

      width: 100%;
      max-width: 440px;

      text-align: center;

      box-shadow:
        0 24px 60px -24px
        rgba(38, 50, 60, .5);
    }

    .logo {
      width: 56px;
      height: 56px;

      object-fit: contain;
      border-radius: 14px;

      margin: 0 auto 16px;

      display: block;
    }

    .logo-fallback {
      width: 56px;
      height: 56px;

      margin: 0 auto 16px;

      display: none;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 800;

      font-size: 1.55rem;
      letter-spacing: -.02em;
      line-height: 1.15;

      margin-bottom: 8px;
    }

    p {
      color: var(--muted);

      font-size: .98rem;
      line-height: 1.55;

      margin-bottom: 6px;
    }

    .icon {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.9rem;

      margin: 4px auto 14px;

      color: #fff;
    }

    .icon.ok {
      background: var(--green);

      box-shadow:
        0 8px 22px -8px
        rgba(78, 141, 91, .6);
    }

    .icon.bad {
      background: var(--danger);

      box-shadow:
        0 8px 22px -8px
        rgba(178, 58, 38, .55);
    }

    .spinner {
      width: 40px;
      height: 40px;

      border: 4px solid var(--line);
      border-top-color: var(--orange);

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin: 6px auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      font-family: var(--font-display);
      font-weight: 700;

      font-size: 1rem;

      text-decoration: none;

      background: var(--navy);
      color: #fff;

      padding: 13px 22px;

      border-radius: 11px;

      margin-top: 18px;

      box-shadow:
        0 9px 20px -8px
        rgba(30, 58, 82, .65);

      transition: .16s;
    }

    .btn:hover {
      background: #16293b;
      transform: translateY(-1px);
    }

    .brand {
      margin-top: 20px;

      font-size: .78rem;

      color: var(--muted);
    }

    .brand b {
      color: var(--ink);

      font-family: var(--font-display);
      font-weight: 800;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Logo -->
    <img
      src="/logo.png"
      alt="Fixibl"
      class="logo"
      onerror="
        this.style.display='none';
        this.nextElementSibling.style.display='block';
      "
    >

    <!-- Fallback logo -->
    <svg
      viewBox="0 0 48 48"
      class="logo-fallback"
      xmlns="http://www.w3.org/2000/svg"
    >
      <rect
        x="2"
        y="2"
        width="44"
        height="44"
        rx="12"
        fill="#1E3A52"
      />

      <polygon
        points="24,13 32.7,18 32.7,28 24,33 15.3,28 15.3,18"
        fill="none"
        stroke="#FCFAF3"
        stroke-width="3"
        stroke-linejoin="round"
      />

      <circle
        cx="24"
        cy="23"
        r="4.3"
        fill="#FCFAF3"
      />

      <path
        d="M24 13c.1-3.6 2.7-6.2 6.4-6.5-.1 3.7-2.7 6.3-6.4 6.5z"
        fill="#6BBE85"
      />

      <circle
        cx="33"
        cy="9.6"
        r="1.7"
        fill="#E07D2B"
      />
    </svg>


    <!-- Loading -->
    <div id="state-loading">

      <div class="spinner"></div>

      <h1>One moment…</h1>

      <p>
        Confirming your email address.
      </p>

    </div>


    <!-- Success -->
    <div
      id="state-success"
      class="hidden"
    >

      <div class="icon ok">✓</div>

      <h1 id="success-title">
        Email verified!
      </h1>

      <p id="success-msg">
        Your email address has been verified.
      </p>

      <a
        class="btn"
        href="https://www.fixibl.com"
      >
        Go to Fixibl →
      </a>

    </div>


    <!-- Error -->
    <div
      id="state-error"
      class="hidden"
    >

      <div class="icon bad">!</div>

      <h1 id="error-title">
        Something went wrong
      </h1>

      <p id="error-msg">
        Please try the link again, or request a fresh one.
      </p>

      <a
        class="btn"
        href="https://www.fixibl.com"
      >
        Back to Fixibl
      </a>

    </div>


    <div class="brand">
      <b>Fixibl</b> · Anything is Fixibl
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      applyActionCode
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /*
     * Fixibl Firebase configuration.
     */
    const firebaseConfig = {
      apiKey:
        "AIzaSyAwFpDNSHGWQYoXbe4UWBNggFYCHJ-K-4Q",

      authDomain:
        "fixify-1.firebaseapp.com",

      projectId:
        "fixify-1",

      storageBucket:
        "fixify-1.firebasestorage.app",

      messagingSenderId:
        "397001927220",

      appId:
        "1:397001927220:web:0c24702fa77fc6a1a53861",

      measurementId:
        "G-0FXM4FHKH4"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    /*
     * Read the Firebase action parameters from the URL.
     */
    const params = new URLSearchParams(
      window.location.search
    );

    const mode = params.get("mode");
    const oobCode = params.get("oobCode");


    function showState(id) {

      const states = [
        "state-loading",
        "state-success",
        "state-error"
      ];

      states.forEach((state) => {

        document
          .getElementById(state)
          .classList.toggle(
            "hidden",
            state !== id
          );

      });
    }


    function showSuccess(title, message) {

      document
        .getElementById("success-title")
        .textContent = title;

      document
        .getElementById("success-msg")
        .textContent = message;

      showState("state-success");
    }


    function showError(title, message) {

      document
        .getElementById("error-title")
        .textContent = title;

      document
        .getElementById("error-msg")
        .textContent = message;

      showState("state-error");
    }


    function handleFirebaseError(error) {

      console.error(
        "Firebase verification error:",
        error
      );

      const code = error?.code || "";

      if (
        code.includes("expired-action-code")
      ) {

        showError(
          "Link expired",
          "This verification link has expired. Please request a new one."
        );

        return;
      }


      if (
        code.includes("invalid-action-code")
      ) {

        showError(
          "Invalid link",
          "This verification link is invalid or has already been used."
        );

        return;
      }


      if (
        code.includes("user-disabled")
      ) {

        showError(
          "Account disabled",
          "This account has been disabled. Please contact Fixibl support."
        );

        return;
      }


      showError(
        "Verification failed",
        "We couldn't verify your email address. Please try requesting a new verification email."
      );
    }


    async function verifyEmail() {

      /*
       * Make sure this is actually a verification link.
       */
      if (mode !== "verifyEmail") {

        showError(
          "Invalid link",
          "This doesn't appear to be a Fixibl email verification link."
        );

        return;
      }


      /*
       * Make sure Firebase gave us the action code.
       */
      if (!oobCode) {

        showError(
          "Invalid link",
          "This verification link is missing its verification code."
        );

        return;
      }


      try {

        /*
         * This is the actual Firebase verification step.
         */
        await applyActionCode(
          auth,
          oobCode
        );


        showSuccess(
          "Email verified!",
          "You're all set. Your Fixibl email address has been verified."
        );

      } catch (error) {

        handleFirebaseError(error);

      }
    }


    verifyEmail();

  </script>

</body>
</html>
